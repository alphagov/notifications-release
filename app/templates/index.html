{% extends "base_template.html" %}
{% set page_title = "Home" %}
{% set heading = "GOVUK Notify Release App" %}

{% block content %}
{% if user %}
<p>Logged in as {{ user }}. <a href="{{ url_for('repos') }}">View repositories</a> | <a
        href="{{ url_for('logout') }}">Logout</a></p>
{% else %}
<p><a href="{{ url_for('login') }}">Login with GitHub</a></p>
{% endif %}
{% endblock %}
